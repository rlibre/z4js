name: npm publish

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version'
        required: true
        default: '1.0.0-manual'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish-and-release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      # prepack builds the command line (bin/z4js.js) with esbuild
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # node:test, no dependency (scripts/test.ts): a failure stops the publication
      - name: Tests
        run: npm test

      # trusted publishing: npm authenticates this workflow through OIDC (id-token: write), no token
      - name: Publish to NPM
        run: |
            if [[ "${{ github.ref_name }}" == *-* ]]; then
                npm publish --access public --provenance --tag next
            else
                npm publish --access public --provenance
            fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
